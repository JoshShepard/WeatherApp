<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/e57faee86c.js" crossorigin="anonymous"></script>
    <script src="newapikey.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1 id="prompt">Search For Your Location!</h1>
        <form id="city-form">
            <input type="search" id="city-search" placeholder="Search for your city..." required />
            <button type="submit" id="search-btn">Search <i class="fas fa-search fa-rotate-90"></i></button>
        </form>
    </main>
</body>
</html>
